# .github/workflows/build-release.yml
#
# Cross-platform build + npm publish + GitHub Release.
#
# Trigger:
#   - push of a `v*` tag (recommended: `git tag v0.2.0 && git push --tags`)
#   - manual `workflow_dispatch` for dry runs
#
# What it does, per platform:
#   1. Build the Rust CLI binaries (`tokenslim`, `tokenslim-server`) on the
#      matching GitHub-hosted runner.
#   2. Stage them + `config/plugins/` into packages/cli-binary-<platform>/
#      via scripts/build-npm-binary-package.mjs.
#   3. `npm pack` the platform package and `npm publish` it under the
#      `@tokenslim/cli-binary-*` name with `--provenance --access public`.
#   4. Collect a SHA-256 manifest of all generated tarballs and upload
#      it as a workflow artifact.
#   5. Attach the tarballs to a GitHub Release titled after the tag.
#
# Required repository secrets:
#   - NODE_AUTH_TOKEN    npm automation token (publishes the packages)
#
# Required repository variables:
#   - (none at the moment)
#
# Versioning:
#   The package versions in packages/cli-binary-*/package.json and in
#   packages/sdk-nodejs/package.json must be updated in lockstep with the
#   pushed tag.  Run `node scripts/bump-version.mjs <version>` before
#   tagging; `validate-versions` below enforces the lockstep on CI.

name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to validate (e.g. 0.5.1). Must match all version-bearing files (bump-version.mjs lockstep)."
        required: true
        type: string
      ref:
        description: "Git ref to validate (commit SHA or branch). Default: the ref that triggered the dispatch."
        required: false
        default: ""
        type: string
    # NOTE: workflow_dispatch is ALWAYS a fixed dry run.  There is no
    # `dry_run` input: the side-effect jobs (release / publish-platforms /
    # publish-sdk / update-lockfile) are hard-gated to
    #   github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # so a dispatch can only build + pack + verify, never release/publish/push.

permissions:
  contents: write   # create GitHub Release
  id-token: write   # npm provenance signing
  packages: write

jobs:
  # ---------------------------------------------------------------------
  # Stage 0: validate that every version-bearing file matches the expected
  # version.  Runs on BOTH triggers (tag push and workflow_dispatch dry run)
  # so the "dry run before tag push" control is actually executable.
  #   - tag push:        expected version derived from the tag (v0.2.3 -> 0.2.3)
  #   - workflow_dispatch: expected version from the `version` input
  # The expected version is the single source of truth: bump the files
  # (node scripts/bump-version.mjs <version>), then validate.
  # ---------------------------------------------------------------------
  validate-versions:
    name: validate versions == expected
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Set up Node 24
        # We need Node only to run `bump-version.mjs --check`; a system
        # Node would also work but pinning the toolchain keeps the gate
        # green on whatever image GitHub rolls out next.
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Derive expected version
        id: derive
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
            echo "expected version from dispatch input: ${VERSION}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#refs/tags/}"
            VERSION="${VERSION#v}"
            echo "expected version from tag ${TAG}: ${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify all files agree
        shell: bash
        # `bump-version.mjs --check` exits 0 when every package.json and
        # Cargo.toml carries the expected version, 1 otherwise.  Failing
        # here surfaces the offending file path in the CI log so the
        # author knows exactly which one to fix.
        run: |
          set -euo pipefail
          node scripts/bump-version.mjs --check "${{ steps.derive.outputs.version }}"

  # ---------------------------------------------------------------------
  # Stage 1: build the Rust CLI on each platform, in parallel.
  # ---------------------------------------------------------------------
  build:
    name: build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: validate-versions
    # NOTE on the build matrix:
    #
    #   `darwin-x64` (macos-13 / Intel Mac) was disabled in 0.5.0 because
    #   the macos-13 runner pool on GitHub Actions was severely starved
    #   (6-hour queue timeouts observed).  Independent release audit
    #   (2026-08-19) requires restoring it: the SDK's optionalDependencies
    #   contract pins `@tokenslim/cli-binary-darwin-x64` at the exact
    #   release version, so shipping `tokenslim` without the darwin-x64
    #   binary package would break Intel-macOS installs.  Keep this entry
    #   in the matrix; if the macos-13 pool degrades again, raise it as a
    #   release-blocking issue rather than silently dropping the platform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,    label: linux-x64-gnu,    target: x86_64-unknown-linux-gnu  }
          - { os: ubuntu-22.04-arm, label: linux-arm64-gnu, target: aarch64-unknown-linux-gnu }
          - { os: macos-13,        label: darwin-x64,       target: x86_64-apple-darwin        }
          - { os: macos-14,        label: darwin-arm64,     target: aarch64-apple-darwin       }
          - { os: windows-2022,    label: windows-x64,      target: x86_64-pc-windows-msvc     }
          - { os: windows-11-arm,  label: windows-arm64,    target: aarch64-pc-windows-msvc    }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --bins --target "${{ matrix.target }}"
          mkdir -p artifacts/bin
          # Windows produces `*.exe`; Linux/macOS produce suffix-less
          # binaries.  Resolve the suffix from the runner so the copy
          # paths match the actual artifacts on every platform
          # (independent release audit, 2026-08-19: suffix-less copies
          # failed on Windows runners — no `tokenslim` etc. on disk).
          if [[ "${{ runner.os }}" == "Windows" ]]; then EXE=".exe"; else EXE=""; fi
          for BIN in tokenslim tokenslim-server log_reorder log_miner; do
            SRC="target/${{ matrix.target }}/release/${BIN}${EXE}"
            # Fail-fast at the source: a missing binary must surface here,
            # not as a confusing npm pack failure later.
            test -f "${SRC}" || { echo "MISSING BINARY: ${SRC}"; exit 1; }
            cp "${SRC}" "artifacts/bin/${BIN}${EXE}"
          done
          ls -lh artifacts/bin/

      - name: Build platform npm package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-npm-binary-package.mjs \
            --platform "${{ matrix.label }}" \
            --bin-dir artifacts/bin \
            --config-dir config \
            | tee artifacts/tarball_path.txt

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.label }}
          path: |
            dist/*.tgz
            artifacts/tarball_path.txt
          retention-days: 14

  # ---------------------------------------------------------------------
  # Dry-run verification (workflow_dispatch only).
  # The 6 platform builds already ran in `build`; this job aggregates the
  # tarballs, generates the SHA-256 manifest, and verifies package versions
  # + SDK optionalDependencies alignment.  It NEVER creates a GitHub Release,
  # NEVER runs `npm publish`, and NEVER pushes the lockfile — all side-effect
  # jobs are hard-gated to tag-push events, so workflow_dispatch is a fixed
  # dry run by construction (no `dry_run` input; see `on.workflow_dispatch`).
  # ---------------------------------------------------------------------
  dry-run-verify:
    name: dry run verify (6 tarballs + manifest + versions)
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download all platform tarballs
        uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true

      - name: 'Generate SHA-256 manifest (fail-fast: count == 6)'
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(ls -1 dist/*.tgz 2>/dev/null | wc -l)
          echo "tarball_count=${COUNT}"
          ls -1 dist/*.tgz 2>/dev/null
          # Fail-fast: a dry run MUST have exactly the 6 platform tarballs.
          test "${COUNT}" = "6" || { echo "FAIL: expected exactly 6 platform tarballs, got ${COUNT}"; exit 1; }
          cd dist
          sha256sum -b *.tgz | tee SHA256SUMS
          cat SHA256SUMS

      - name: 'Verify tarball package names + versions (fail-fast: exact 6-set)'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          # The exact expected platform-package name set (6).  Any duplicate,
          # missing, or unexpected package fails the dry run.
          EXPECTED="@tokenslim/cli-binary-linux-x64-gnu @tokenslim/cli-binary-linux-arm64-gnu @tokenslim/cli-binary-darwin-x64 @tokenslim/cli-binary-darwin-arm64 @tokenslim/cli-binary-windows-x64 @tokenslim/cli-binary-windows-arm64"
          SEEN=""
          for tgz in dist/*.tgz; do
            PKGJSON=$(tar -xzOf "$tgz" package/package.json)
            NAME=$(echo "$PKGJSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).name))")
            PKGVER=$(echo "$PKGJSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
            echo "$(basename "$tgz"): name=${NAME} version=${PKGVER}"
            test "$PKGVER" = "$VERSION" || { echo "VERSION MISMATCH: ${NAME} ${PKGVER} != ${VERSION}"; exit 1; }
            echo "$EXPECTED" | tr ' ' '\n' | grep -qx "$NAME" || { echo "UNEXPECTED PACKAGE: ${NAME}"; exit 1; }
            case " $SEEN " in *" $NAME "*) echo "DUPLICATE PACKAGE: ${NAME}"; exit 1;; esac
            SEEN="${SEEN} ${NAME}"
          done
          COUNT=$(echo "$SEEN" | tr ' ' '\n' | grep -c '.')
          test "$COUNT" = "6" || { echo "FAIL: expected 6 distinct packages, got ${COUNT}:${SEEN}"; exit 1; }
          echo "OK: exact 6 platform packages present, all versions == ${VERSION}"

      - name: Verify SDK optionalDependencies alignment
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          node -e "
            const pkg = require('./packages/sdk-nodejs/package.json');
            const deps = pkg.optionalDependencies || {};
            const names = Object.keys(deps).filter(k => k.startsWith('@tokenslim/cli-binary-'));
            console.log('binary optionalDependencies:', JSON.stringify(names));
            if (names.length !== 6) { console.error('expected 6 platform packages, got ' + names.length); process.exit(1); }
            for (const n of names) {
              if (deps[n] !== '$VERSION') { console.error('MISMATCH ' + n + '=' + deps[n] + ' != ' + '$VERSION'); process.exit(1); }
            }
            console.log('SDK optionalDependencies: 6/6 == ' + '$VERSION');
          "

      - name: Provenance preconditions (static)
        shell: bash
        run: |
          set -euo pipefail
          echo "permissions.id-token: write (static) — OIDC identity present for a real publish"
          echo "npm version: $(npm --version)"
          echo "NOTE: registry-side acceptance of provenance attestation can only be proven by a real controlled publish (test scope/registry or approved prerelease); this dry run verifies packaging and preconditions only."

  # ---------------------------------------------------------------------
  # Stage 2: aggregate SHA-256 manifest + GitHub Release.
  # Runs only after publish-sdk (-> publish-platforms -> build) so the
  # GitHub Release is created only once all 6 platform packages AND the
  # SDK have been published — "release is externally visible only when
  # the full publish set succeeded" (independent release audit, 2026-08-19).
  # The tarballs come from `build`'s uploaded artifacts, which persist.
  # ---------------------------------------------------------------------
  release:
    name: github release
    needs: publish-sdk
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all platform tarballs
        uses: actions/download-artifact@v4
        with:
          # The build job uploads its artifact as `dist/*.tgz` (the
          # script writes the .tgz to <repo>/dist).  Downloading to
          # `path: dist` would nest it at `dist/dist/*.tgz`; using
          # `path: .` keeps the original `dist/<name>.tgz` layout so
          # the `cd dist && sha256sum -b *.tgz` step below finds them.
          path: .
          merge-multiple: true

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -b *.tgz | tee SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tgz
            dist/SHA256SUMS
          generate_release_notes: true

  # ---------------------------------------------------------------------
  # Stage 3: publish the platform packages to npm.
  # The npm publish step needs the tarballs produced in stage 1, so it
  # also runs after `build` (in parallel with `release`).
  #
  # Each platform job publishes its own tarball to the matching
  # @tokenslim/cli-binary-* package.  We use `--provenance` for npm's
  # supply-chain attestation.
  # ---------------------------------------------------------------------
  publish-platforms:
    name: npm publish ${{ matrix.label }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64-gnu,    name: "@tokenslim/cli-binary-linux-x64-gnu"    }
          - { label: linux-arm64-gnu,  name: "@tokenslim/cli-binary-linux-arm64-gnu"  }
          - { label: darwin-x64,       name: "@tokenslim/cli-binary-darwin-x64"       }
          - { label: darwin-arm64,     name: "@tokenslim/cli-binary-darwin-arm64"     }
          - { label: windows-x64,      name: "@tokenslim/cli-binary-windows-x64"      }
          - { label: windows-arm64,    name: "@tokenslim/cli-binary-windows-arm64"    }

    steps:
      # Run `actions/checkout` even though the only input the publish
      # step needs is the tarball.  `--provenance` requires npm to
      # verify the source repository by running `git ls-remote`
      # against `git config --get remote.origin.url`.  Without a
      # checked-out repo the publish job's CWD is a fresh runner with
      # no git state, so npm falls back to constructing a URL from
      # the tarball filename (e.g.
      # `ssh://git@github.com/dist/<tarball>.git`) which obviously
      # has no public key configured, producing
      # `git@github.com: Permission denied (publickey)`.  Checking
      # out the same tag the build job used gives npm the right
      # remote to verify provenance against.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24 (bundles npm 11.x)
        # We need npm >=11.5.1 for `npm publish --provenance` to
        # correctly read the source repo from the tarball's
        # `package.json#repository` (or from `git config` in the CWD).
        # Older npm versions have a buggy fallback that builds an
        # SSH URL from the tarball filename and fails on a CI runner
        # with no github.com SSH key.  Node 24 bundles npm 11.x,
        # which is fixed.
        #
        # We use `actions/setup-node` rather than
        # `npm install -g npm@latest` because the system npm lives
        # under /usr/local and tries to write to
        # /usr/local/share/man/man7 during the rebuild step; the
        # runner user does not own that path, so the global install
        # fails with EACCES.  `setup-node` installs the whole tool-
        # chain under $RUNNER_TOOLS (user-owned) and is the only
        # way to get a writable global prefix on a default
        # ubuntu-22.04 runner.
        #
        # NOTE: We intentionally do NOT set `registry-url` here.
        # When `registry-url` is set, `setup-node` creates a `.npmrc`
        # that may contain legacy settings (e.g. `always-auth`) which
        # cause npm to run `git ls-remote` against the package's
        # repository, even without `--provenance`.  The fallback URL
        # npm constructs (`ssh://git@github.com/dist/<tarball>.git`)
        # has no SSH key on the CI runner, so `git ls-remote` fails
        # with `Permission denied (publickey)`.
        #
        # We set the auth token manually in the publish step below.
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download platform tarball
        uses: actions/download-artifact@v4
        with:
          name: pkg-${{ matrix.label }}
          # The artifact was uploaded as `dist/<name>.tgz`.  Downloading
          # to `path: .` preserves that layout, so `ls dist/*.tgz`
          # below finds the tarball at `./dist/<name>.tgz`.
          path: .

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TARBALL=$(ls dist/*.tgz | head -1)
          echo "--- npm/node versions ---"
          npm --version
          node --version
          echo "--- tarball manifest ---"
          tar -tzf "$TARBALL" | grep -E '(package.json|package/)' | sed -n '1,5p'
          tar -xzOf "$TARBALL" package/package.json
          echo "--- git remote npm will verify ---"
          git config --get remote.origin.url
          git rev-parse HEAD

          # Extract the tarball and publish from the extracted folder.
          #
          # `npm publish <tarball>` in npm 11.x has a bug: it tries to
          # run `git ls-remote` to verify the source repo, but instead
          # of reading `repository` from the tarball's package.json or
          # `git config` from the CWD, it constructs an SSH URL from
          # the tarball filename itself:
          #
          #   ssh://git@github.com/dist/<tarball-name>.git
          #
          # The CI runner has no SSH key for github.com, so
          # `git ls-remote` fails with `Permission denied (publickey)`.
          #
          # Publishing from an extracted folder fixes this: npm reads
          # package.json from the folder, and reads the git context
          # from the CWD (which is a git repo thanks to
          # actions/checkout).  The `package/` directory is inside
          # the git repo, so `git config --get remote.origin.url`
          # works from there.
          tar -xzf "$TARBALL"
          cd package
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          echo "Publishing $TARBALL → ${{ matrix.name }}"
          # `--provenance` is a real publish promise (workflow header + audit):
          # the job has `id-token: write`, checks out the tag so npm can verify
          # the source repo, and Node 24 bundles npm 11.x which reads provenance
          # metadata correctly.  Publishing from the extracted folder (not the
          # tarball path) avoids npm 11.x's SSH-URL provenance fallback bug.
          npm publish \
            --access public \
            --tag latest \
            --provenance

  # ---------------------------------------------------------------------
  # Stage 4: publish the JS-only `tokenslim` package.  It has no
  # native binaries; npm install pulls the matching @tokenslim/cli-binary-*
  # optional dep on each platform automatically.
  # ---------------------------------------------------------------------
  publish-sdk:
    name: npm publish tokenslim
    needs: publish-platforms
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24 (bundles npm 11.x)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
        # We deliberately do NOT set `registry-url` here.  The
        # `publish-platforms` job uses this exact pattern (Node 24,
        # no `registry-url`, manual `npm config set //registry.npmjs.org/:_authToken`)
        # and works.  When `registry-url` is set, `setup-node` creates
        # a `.npmrc` and on this workflow the auth-token injection
        # is silently dropped (we see `NODE_AUTH_TOKEN: <empty>` in
        # the CI log even though the secret is configured).  Manual
        # `npm config set` is the path of least surprise.

      - name: Install deps
        working-directory: packages/sdk-nodejs
        shell: bash
        # We use `npm install` rather than `npm ci` because the
        # optionalDependencies here pin specific @tokenslim/cli-binary-*
        # versions; those are released in lock-step with the SDK and
        # `npm ci` rejects the install whenever the version in
        # package.json is newer than the one in package-lock.json
        # (which is exactly the case right after a release bump).
        # `npm install` regenerates the lock and is the right tool
        # for the pre-publish install.
        run: |
          set -euo pipefail
          echo "--- debug: NODE_AUTH_TOKEN length=${#NODE_AUTH_TOKEN} ---"
          npm install --no-audit --no-fund

      - name: Publish to npm
        working-directory: packages/sdk-nodejs
        shell: bash
        # `prepublishOnly` in package.json runs `npm run clean && npm run build`
        # automatically before `npm publish`, so we don't invoke `npm run build`
        # explicitly here.
        #
        # Independent release audit (2026-08-19): the workflow header claims
        # `--provenance` for the SDK, so the actual command must match the
        # promise.  `id-token: write` + actions/checkout of the tag give npm
        # the OIDC identity and the source repo to attest against; Node 24's
        # npm 11.x reads provenance correctly.  Publishing from the repo CWD
        # (packages/sdk-nodejs is inside the checked-out tag) avoids npm 11.x's
        # tarball-path SSH-URL provenance fallback bug.
        run: |
          set -euo pipefail
          echo "--- debug: token length=${#NODE_AUTH_TOKEN}, npm=$(npm --version) ---"
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish \
            --access public \
            --tag latest \
            --provenance

  # ---------------------------------------------------------------------
  # Stage 5: 发版完成后，自动重新生成 package-lock.json 并提交回 main。
  # 之前 bump-version.mjs 在本地生成 lock 时，registry 上还没有新版本
  # 的 @tokenslim/cli-binary-* 包，导致 lock 文件里这些条目缺少
  # version/resolved/integrity 字段。等 publish-sdk 把新版本发布到
  # npm 后，这里重新生成 lock 就能正确解析。
  # ---------------------------------------------------------------------
  update-lockfile:
    name: Regenerate package-lock.json
    needs: publish-sdk
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regenerate lockfile
        working-directory: packages/sdk-nodejs
        run: npm install --no-audit --no-fund

      - name: Commit & push lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/sdk-nodejs/package-lock.json
          git commit -m "chore: regenerate package-lock.json for ${{ github.ref_name }}"
          git push
