name: Publish Python SDK to PyPI

on:
  push:
    tags:
      - 'v*' # Automatically trigger on new tags like v0.3.0
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -i ${{ matrix.python-version }}
          sdist: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10' }}
          working-directory: crates/tokenslim-py

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: crates/tokenslim-py/dist

  publish:
    name: Publish to PyPI
    needs: [build-wheels]
    runs-on: ubuntu-latest
    
    # Required for PyPI Trusted Publishing (OIDC)
    permissions:
      id-token: write
      contents: read
      
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # TODO(P3-211): tokenslim-client（sdk/python）为 0.4 时代的 REST 客户端 SDK，
  # 从未发布过、README 无文档、版本未纳入 scripts/bump-version.mjs（停在 0.4.0）。
  # 2026-09-11 v0.5.1 发布时该 job 因 PyPI Trusted Publishing 未注册 pending
  # publisher 而 400 失败（项目名首次发布必须先在 pypi.org 注册）。
  # 处置：临时置 continue-on-error，避免把发布流水线拖红；正式发布需三步——
  #   1) pypi.org 注册 pending publisher（tokenslim-client / nuoyazhizhou /
  #      tokenslim / pypi-publish.yml）
  #   2) 将其版本纳入 bump-version.mjs 并升到当前版本
  #   3) 补 README 文档承诺后去掉本行的 continue-on-error
  # 或直接退役该 job（主包 tokenslim 已支持进程内压缩，REST 客户端非必需）。
  publish-sdk:
    name: Publish tokenslim-client Python SDK to PyPI
    needs: [publish]
    runs-on: ubuntu-latest
    continue-on-error: true  # TODO(P3-211)：见上，注册 pending publisher 后移除
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: pip install build

      - name: Build Python SDK
        working-directory: sdk/python
        run: python -m build

      - name: Publish tokenslim-client to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
          skip-existing: true

