            /// 1. 元数据为 None。
            /// 2. 假设输入为文本，不进行二进制检测。
            /// 3. 适用于管道、网络流等。
            ///
            /// # 依赖
            /// 无
            ///
            /// 未来优先级
            pub fn from_reader<R: std::io::Read + Send + 'static>(reader: R) -> Self {
