module:
  name: stream_reader
  path: src/core/stream_reader
  dependencies:
    - memmap2 = "0.5"
    - encoding_rs = "0.8"
    - memchr = "2.5"
  files:
    - name: mod.rs
      content: |
        mod types;
        mod  methods;
        pub use types::{StreamReader, StreamError, FileMetadata, FileType, Bom, SliceInput, LineIterator, BlockIterator};
        pub use methods::*;

    - name: types
      content: |
        use std::path::PathBuf;
        use std::time::SystemTime;
        use std::fs::Permissions;
        use std::borrow::Cow;

        /// 文件元数据
        #[derive(Debug, Clone)]
        pub struct FileMetadata {
            pub path: Option<PathBuf>,
            pub size: u64,
            pub file_type: FileType,
            pub created: Option<SystemTime>,
            pub modified: Option<SystemTime>,
            pub permissions: Option<Permissions>,
            pub owner: Option<String>,
            pub bom: Option<Bom>,
        }

        /// 文件类型（由 StreamReader 初步判断）
        #[derive(Debug, Clone, Copy, PartialEq, Eq)]
        pub enum FileType {
            Text,
            Binary,
            Unknown,
        }

        /// BOM 类型
        #[derive(Debug, Clone, Copy, PartialEq, Eq)]
        pub enum Bom {
            Utf8,
            Utf16Le,
            Utf16Be,
        }

        /// StreamReader 错误类型
        #[derive(Debug, thiserror::Error)]
        pub enum StreamError {
            #[error("I/O error: {0}")]
            Io(#[from] std::io::Error),
            #[error("UTF-8 error: {0}")]
            Utf8(#[from] std::str::Utf8Error),
            #[error("Binary file detected")]
            BinaryDetected,
            #[error("Invalid path")]
            InvalidPath,
            #[error("Unsupported encoding")]
            UnsupportedEncoding,      // 未来可能使用
            #[error("Line too long")]
            TooLongLine,              // 未来可能使用
        }

        /// 输入片段，由 StreamReader 产生，供 TextSlicer 消费
        #[derive(Debug)]
        pub struct SliceInput<'a> {
            pub raw: Cow<'a, str>,
            pub offset: usize,
            pub line_number: usize,
            pub file_metadata: Option<&'a FileMetadata>,
        }

        /// StreamReader 主结构
        pub struct StreamReader<'a> {
            // 内部字段暂不公开
            // 使用枚举区分来源：Mmap 或 Str
            inner: Inner,
            metadata: Option<FileMetadata>,
        }

        enum Inner<'a> {
            Mmap(memmap2::Mmap),
            Str(&'a str), // 注意：实际生命周期需与 StreamReader 关联
        }

        /// 逐行迭代器
        pub struct LineIterator<'a> {
            // 内部字段
        }

        impl<'a> Iterator for LineIterator<'a> {
            type Item = SliceInput<'a>;
            fn next(&mut self) -> Option<Self::Item> {
                todo!()
            }
        }

        /// 按块迭代器
        pub struct BlockIterator<'a> {
            // 内部字段
        }

        impl<'a> Iterator for BlockIterator<'a> {
            type Item = SliceInput<'a>; // 注意：块迭代器可能只提供 raw 和 offset，line_number 可能为0
            fn next(&mut self) -> Option<Self::Item> {
                todo!()
            }
        }

    - name: methods.rs
      content: |
        use std::path::Path;
        use super::types::*;

        impl<'a> StreamReader<'a> {
            // ========== MVP 函数（必须实现） ==========
            /// 从文件路径创建 Reader（使用 mmap）（附带元数据）
            ///
            /// # 参数
            /// - `path`: 文件路径
            ///
            /// # 返回值
            /// - `Result<Self, StreamError>`: 成功返回 StreamReader，失败返回错误
            ///
            /// # 实现要求
            /// 1. 打开文件，如果不存在返回 `Io` 错误。
            /// 2. 读取文件元数据（大小、修改时间、权限等）。
            /// 3. 调用内部 `detect_binary` 检测是否为二进制文件，若是则返回 `BinaryDetected`。
            /// 4. 支持大文件流式读取，不一次性加载全部内容。
            /// 5. （未来）检测 BOM 并记录。
            ///
            /// # 测试要点
            /// - 正常文本文件 → 返回 Reader，元数据正确。
            /// - 不存在的文件 → Io 错误。
            /// - 权限不足的文件 → Io 错误。
            /// - 二进制文件（如 .exe）→ BinaryDetected。
            /// - 空文件 → 返回 Reader（空内容）。
            ///
            /// # 依赖
            /// 无（标准库）
            ///
            /// MVP 优先级
            pub fn from_file(path: &Path) -> Result<Self, StreamError> {
                todo!()
            }

            /// 从字符串创建 Reader
            ///
            /// # 参数
            /// - `text`: 字符串切片
            ///
            /// # 返回值
            /// - `Self`: StreamReader 实例
            ///
            /// # 实现要求
            /// 1. 直接持有字符串引用，不复制。
            /// 2. 元数据为 `None`。
            /// 3. 内部状态标记为文本文件（`is_text()` 返回 true）。
            ///
            /// # 测试要点
            /// - 普通字符串。
            /// - 空字符串。
            /// - 包含非法 UTF-8 的字符串（将在迭代时处理）。
            ///
            /// # 依赖
            /// 无
            ///
            /// MVP 优先级
            pub fn from_str(text: &'a str) -> Self {
                todo!()
            }

            /// 获取文件元数据
            ///
            /// # 返回值
            /// - `Option<&FileMetadata>`: 如果是从文件创建的则返回 Some，否则 None
            ///
            /// # 测试要点
            /// - 从文件创建的 Reader → Some(metadata)
            /// - 从字符串创建的 Reader → None
            ///
            /// # 依赖
            /// 无
            ///
            /// MVP 优先级
            pub fn metadata(&self) -> Option<&FileMetadata> {
                todo!()
            }

            /// 判断是否为文本文件
            ///
            /// # 返回值
            /// - `bool`: true 表示文本文件，false 表示二进制
            ///
            /// # 实现要求
            /// 基于二进制检测结果或创建来源（字符串总是文本）。
            ///
            /// # 测试要点
            /// - 文本文件 → true
            /// - 二进制文件 → false
            /// - 字符串创建的 Reader → true
            ///
            /// # 依赖
            /// 无
            ///
            /// MVP 优先级
            pub fn is_text(&self) -> bool {
                todo!()
            }

            /// 返回逐行迭代器
            ///
            /// # 返回值
            /// - `LineIterator`: 迭代器，每次返回 `(line: &str, offset: usize, line_number: usize)`
            ///
            /// # 实现要求
            /// 1. 按 LF (`\n`) 或 CRLF (`\r\n`) 分割行，自动识别。
            /// 2. 每行返回文本切片、字节偏移量（从文件开始）、行号（从1开始）。
            /// 3. 如果遇到无效 UTF-8 字节，应替换为 Unicode 替换字符 `�`（U+FFFD）。
            /// 4. 如果某行过长（超过预设阈值），未来可触发错误或分块，MVP 阶段不处理。
            /// 5. 迭代器应实现 `Iterator` trait。
            ///
            /// # 测试要点
            /// - 空文件 → 迭代器无元素。
            /// - 混合换行符（LF 和 CRLF）→ 正确分割。
            /// - 最后一行无换行符 → 仍作为一行返回。
            /// - 超长行（>10KB）→ 正常返回，不截断。
            /// - 包含非法 UTF-8 字节 → 替换为 `�`。
            ///
            /// # 依赖
            /// 可选用 `memchr` 加速，但 MVP 可先用标准库手动扫描。
            ///
            /// MVP 优先级
            pub fn iter_lines(&self) -> LineIterator {
                todo!()
            }

            /// 返回按块迭代器
            ///
            /// # 参数
            /// - `block_size`: 块大小（字节）
            ///
            /// # 返回值
            /// - `Result<BlockIterator, StreamError>`: 成功返回迭代器，失败返回错误
            ///
            /// # 实现要求
            /// 1. 按指定大小（字节）分块，每块返回文本切片和偏移量。
            /// 2. 如果 `block_size == 0`，返回 `StreamError::InvalidArgument`（可扩展错误类型）。
            /// 3. 如果块边界落在多字节字符中间，应确保返回的切片是合法的 UTF-8 边界（可能需要调整块大小）。
            /// 4. 迭代器应实现 `Iterator` trait。
            ///
            /// # 测试要点
            /// - 块大小小于文件长度 → 生成多个块。
            /// - 块大小大于文件长度 → 生成一个块。
            /// - 块大小为 0 → 返回错误。
            /// - 空文件 → 迭代器无元素。
            /// - 多字节字符边界 → 正确处理，不产生乱码。
            ///
            /// # 依赖
            /// 无
            ///
            /// MVP 优先级
            pub fn iter_blocks(&self, block_size: usize) -> Result<BlockIterator, StreamError> {
                todo!()
