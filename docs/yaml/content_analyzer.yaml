module:
  name: content_analyzer
  path: src/core/content_analyzer
  dependencies:
    - regex = "1.10"      # 用于规则匹配
  files:
    - name: mod.rs
      content: |
        mod types;
        mod  methods;
        pub use types::{ContentAnalyzer, AnalyzerConfig, Rule, AnalysisResult, AnalyzerError};
        pub use methods::*;

    - name: types
      content: |
        use regex::Regex;
        use crate::core::text_slicer::SliceType;

        /// 分析结果
        #[derive(Debug, Clone)]
        pub struct AnalysisResult {
            pub slice_type: SliceType,
            pub confidence: f32,
            pub details: Option<String>,
        }

        /// 单个规则的定义
        pub struct Rule {
            pub name: String,
            pub pattern: Regex,
            pub type_on_match: SliceType,
            pub weight: f32,
        }

        /// 内容分析器配置
        #[derive(Clone)]
        pub struct AnalyzerConfig {
            pub enable_rules: bool,
            pub enable_embedding: bool,
            pub rules: Vec<Rule>,
            pub fallback_type: SliceType,
            pub confidence_threshold: f32,
        }

        /// 内容分析器错误类型
        #[derive(Debug, thiserror::Error)]
        pub enum AnalyzerError {
            #[error("Regex error: {0}")]
            Regex(#[from] regex::Error),
            #[error("Invalid rule configuration")]
            InvalidConfig,
        }

        /// 内容分析器主结构
        pub struct ContentAnalyzer {
            config: AnalyzerConfig,
        }

    - name: methods.rs
      content: |
        use super::types::*;
        use crate::core::text_slicer::Slice;

        impl ContentAnalyzer {
            // ========== MVP 函数 ==========

            /// 创建新的 ContentAnalyzer 实例
            ///
            /// # 参数
            /// - `config`: 分析器配置
            ///
            /// # 返回值
            /// - `Self`: ContentAnalyzer 实例
            ///
            /// # 实现要求
            /// 1. 验证配置中的规则是否有效（正则编译是否成功）。
            /// 2. 如果规则编译失败，应通过 `AnalyzerError` 返回错误（但当前构造函数无返回 Result，可 panic 或保留为 infallible）。
            ///    MVP 阶段可假设规则有效，或改为返回 Result。
            ///
            /// # 测试要点
            /// - 配置正确应用。
            /// - 非法正则应导致 panic（或返回 Result）。
            ///
            /// # 依赖
            /// - `regex`
            ///
            /// MVP 优先级
            pub fn new(config: AnalyzerConfig) -> Result<Self, AnalyzerError> {
                todo!()
            }

            /// 对给定的切片进行内容类型识别
            ///
            /// # 参数
            /// - `slice`: 从 TextSlicer 获得的切片
            ///
            /// # 返回值
            /// - `AnalysisResult`: 分析结果，包含最终类型和置信度
            ///
            /// # 实现要求
            /// 1. 遍历所有规则，对每条规则在切片文本中匹配。
            /// 2. 每匹配一条规则，累加其权重（可设计为多次匹配累加，或只计一次）。
            /// 3. 根据累加得分，选出得分最高的类型作为候选。
            /// 4. 调用内部归一化函数将得分转换为置信度。
            /// 5. 如果最高置信度低于 `confidence_threshold`，则使用 `fallback_type`。
            /// 6. 返回 `AnalysisResult`。
            ///
            /// # 测试要点
            /// - 单条规则匹配 → 返回对应类型和权重。
            /// - 多条规则匹配 → 累加置信度，返回最高分类型。
            /// - 无规则匹配 → 返回 `fallback_type`，置信度 0.0。
            /// - 正则规则应正确处理特殊字符。
            ///
            /// # 依赖
            /// - `regex`
            ///
            /// MVP 优先级
            pub fn analyze<'a>(&self, slice: &Slice<'a>) -> AnalysisResult {
                todo!()
            }

            // ---------- 内部辅助函数 ----------
            /// 置信度归一化（内部）
            ///
            /// # 参数
            /// - `raw_score`: 原始累加得分
            ///
            /// # 返回值
            /// - `f32`: 归一化到 [0.0, 1.0] 的置信度
            ///
            /// # 实现要求
            /// MVP 阶段可简单使用 `min(raw_score, 1.0)`，或假设权重总和不超过 1 直接返回 raw_score。
            ///
            /// MVP 优先级
            fn normalize_confidence(&self, raw_score: f32) -> f32 {
                todo!()
            }

            // ========== 未来函数（待实现） ==========

            /// 获取当前加载的所有规则列表
            ///
            /// # 返回值
            /// - `Vec<(&str, SliceType)>`: 规则名称和对应类型
            ///
            /// # 实现要求
            /// 遍历内部规则，提取名称和类型。
            ///
            /// # 测试要点
            /// - 返回的列表与配置一致。
            ///
            /// 未来优先级
            pub fn list_rules(&self) -> Vec<(&str, SliceType)> {
                todo!()
            }

            /// 动态更新规则
            ///
            /// # 参数
            /// - `new_rules`: 新规则列表
            ///
            /// # 返回值
            /// - `Result<(), AnalyzerError>`: 成功或错误（如正则编译失败）
            ///
            /// # 实现要求
            /// 1. 验证新规则的正则有效性。
            /// 2. 替换内部规则列表。
            /// 3. 返回结果。
            ///
            /// # 测试要点
            /// - 更新后 `analyze` 使用新规则。
            /// - 非法规则应返回错误。
            ///
            /// 未来优先级
            pub fn update_rules(&mut self, new_rules: Vec<Rule>) -> Result<(), AnalyzerError> {
                todo!()
            }
        }

