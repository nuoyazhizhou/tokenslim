module:
  name: dictionary_engine
  path: src/core/dictionary_engine
  dependencies:
    - serde = { version = "1.0", features = ["derive"] }
    - thiserror = "1.0"
    - serde_json = "1.0"      # 用于序列化
  files:
    - name: mod.rs
      content: |
        mod types;
        mod  methods;
        pub use types::{DictionaryEngine, Dictionary, DictType, DictError};
        pub use methods::*;

    - name: types
      content: |
        use std::collections::HashMap;
        use serde::{Serialize, Deserialize};

        /// 字典项类型前缀
        #[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]
        pub enum DictType {
            Path,      // 文件/目录路径，token 前缀 $P
            Package,   // 包名/命名空间，token 前缀 $PK
            Macro,     // 宏定义/编译选项，token 前缀 $M
            File,      // 文件名，token 前缀 $F
            Custom(String), // 自定义类型，插件可注册（未来）
        }

        /// 字典引擎主结构
        pub struct DictionaryEngine {
            pub(crate) paths: HashMap<String, String>,      // original -> token
            pub(crate) packages: HashMap<String, String>,
            pub(crate) macros: HashMap<String, String>,
            pub(crate) files: HashMap<String, String>,
            pub(crate) custom: HashMap<String, HashMap<String, String>>, // 按自定义类型分组
            pub(crate) next_ids: HashMap<DictType, usize>,  // 各类型下一个可用序号
        }

        /// 对外暴露的字典（不可变，用于还原）
        #[derive(Debug, Clone, Serialize, Deserialize)]
        pub struct Dictionary {
            pub paths: HashMap<String, String>,    // token -> original
            pub packages: HashMap<String, String>,
            pub macros: HashMap<String, String>,
            pub files: HashMap<String, String>,
            pub custom: HashMap<String, HashMap<String, String>>,
        }

        /// 错误类型
        #[derive(Debug, thiserror::Error)]
        pub enum DictError {
            #[error("Token conflict: {0}")]
            TokenConflict(String),
            #[error("Type not registered: {0}")]
            TypeNotRegistered(String),
            #[error("Serialization error: {0}")]
            Serialization(#[from] serde_json::Error),
        }

